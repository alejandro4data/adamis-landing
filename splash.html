<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Aula - ADAMIS</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* (Tus mismos estilos CSS bonitos de siempre) */
        body { 
            margin: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #F9F1D0, #E6C874); font-family: 'Outfit', sans-serif;
        }
        .container {
            background: rgba(255, 255, 255, 0.95); padding: 40px; border-radius: 20px;
            box-shadow: 0 20px 50px rgba(92, 75, 37, 0.15); text-align: center; width: 300px;
        }
        input, select {
            width: 100%; padding: 12px; margin-bottom: 15px; border: 2px solid #E6C874;
            border-radius: 8px; font-size: 1.2rem; text-align: center; color: #5C4B25; outline: none; box-sizing: border-box;
        }
        button {
            background: #5C4B25; color: #F9F1D0; border: none; padding: 12px; border-radius: 50px;
            font-size: 1rem; font-weight: 700; cursor: pointer; width: 100%; transition: 0.2s;
        }
        button:hover { background: #3e2b08; transform: scale(1.02); }
        .error { 
            color: #d32f2f; margin-top: 15px; font-weight: bold; 
            display: none; /* Oculto por defecto */
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Acceso Estudiantes</h2>
        
        <form action="/api/auth-login" method="POST">
            <select name="centro" id="centro" required>
                <option value="" disabled selected>Selecciona tu centro</option>
                <option value="Colegio Ábaco">Colegio Ábaco</option>
                <!--<option value="centro_b">Centro B</option> -->
                <!--<option value="centro_c">Centro C</option> -->
            </select>

            <input type="password" name="password" placeholder="Contraseña de la Clase" required>
            <button type="submit">Entrar</button>
        </form>

        <p class="error" id="errorMsg">🚫 Contraseña incorrecta</p>
    </div>

    <script>
        // Pequeño script solo para mostrar el mensaje de error si la URL trae ?error=true
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('error')) {
            document.getElementById('errorMsg').style.display = 'block';
            // Vibración para feedback móvil
            if(navigator.vibrate) navigator.vibrate(200);
        }
    </script>
    <script>
        (function () {
        const form = document.querySelector("form");
        const centroSelect = document.getElementById("centro");

        function uuid() {
            if (crypto?.randomUUID) return crypto.randomUUID();
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
            const r = Math.random()*16|0, v = c==='x'?r:(r&0x3|0x8);
            return v.toString(16);
            });
        }

        function clearLegacyLocalStorage() {
            try {
            for (let i = localStorage.length - 1; i >= 0; i--) {
                const k = localStorage.key(i);
                if (k && k.startsWith("poll:")) localStorage.removeItem(k);
            }
            } catch {}
        }

        form.addEventListener("submit", () => {
            try {
            sessionStorage.clear();
            clearLegacyLocalStorage();

            sessionStorage.setItem("session_uuid", uuid());
            sessionStorage.setItem("centro", centroSelect.value);
            } catch {}
        });
        })();
    </script>
</body>
</html>
