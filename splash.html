<!DOCTYPE html>
<html lang="es" data-page="splash">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,follow">
    <title>Acceso Aula - ADAMIS</title>
    <script defer src="./app/i18n.js"></script>
    <script defer src="./app/app.js"></script>
    <script src="./app/page_transition.js?v=white-sheen-1"></script>
<style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                radial-gradient(circle at top, rgba(255, 255, 255, 0.65), transparent 35%),
                linear-gradient(135deg, #F9F1D0, #E6C874);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, Cantarell, "Noto Sans", Arial, sans-serif;
        }
        .shell {
            width: min(980px, 100%);
        }
        .hero {
            text-align: center;
            margin-bottom: 28px;
            color: #5C4B25;
        }
        .hero h1 {
            margin: 0 0 8px;
            font-size: clamp(2.2rem, 5vw, 3.4rem);
            letter-spacing: 0.08em;
        }
        .hero p {
            margin: 0;
            font-size: 1.05rem;
            color: #7A632F;
        }
        .access-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 24px;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 32px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(92, 75, 37, 0.15);
            text-align: center;
        }
        .container h2 {
            margin: 0 0 10px;
            color: #5C4B25;
        }
        .container p.helper {
            margin: 0 0 20px;
            color: #7A632F;
            font-size: 0.96rem;
        }
        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #E6C874;
            border-radius: 10px;
            font-size: 1rem;
            text-align: center;
            color: #5C4B25;
            outline: none;
            box-sizing: border-box;
            background: #fffdf6;
        }
        button {
            background: #5C4B25;
            color: #F9F1D0;
            border: none;
            padding: 12px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }
        button:hover {
            background: #3e2b08;
            transform: scale(1.02);
        }
        .teacher-button {
            background: linear-gradient(135deg, #B38A2C, #8B6B20);
        }
        .teacher-button:hover {
            background: linear-gradient(135deg, #9E7920, #6E5317);
        }
        .error {
            color: #d32f2f;
            margin-top: 15px;
            font-weight: bold;
            display: none;
        }
        .config-note {
            margin: 0 0 15px;
            color: #7A632F;
            font-size: 0.9rem;
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .logout-integrated {
            position: fixed !important;
            top: 16px;
            right: 22px;
            z-index: 10001;
            width: 52px !important;
            min-width: 52px !important;
            height: 52px !important;
            min-height: 52px !important;
            padding: 0 !important;
            border: 0 !important;
            border-radius: 999px !important;
            background-color: rgba(255, 255, 255, 0.76) !important;
            color: #374151;
            box-shadow: 0 12px 28px rgba(92, 75, 37, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.8) !important;
            cursor: pointer;
        }
        .settings-gear-btn {
            transition: transform .9s ease, box-shadow .2s ease, background-color .2s ease;
            transform-origin: center;
            transform: scale(1) rotate(0deg);
        }
        .settings-gear-btn:hover {
            background-color: #fff !important;
            transform: scale(1.08) rotate(360deg);
        }
        .settings-gear-btn:focus-visible {
            outline: 3px solid rgba(139, 107, 32, 0.28);
            outline-offset: 4px;
        }
        .logout-modal {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity .18s ease, visibility .18s ease;
        }
        .logout-modal.is-open {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }
        .logout-dialog {
            width: min(92vw, 480px);
            background: #fff;
            color: #0f172a;
            border: 1px solid rgba(2, 6, 23, .08);
            border-radius: 18px;
            box-shadow: 0 24px 60px rgba(2, 6, 23, .18), 0 6px 16px rgba(2, 6, 23, .08);
            padding: 20px 20px 16px;
        }
        .settings-popover {
            max-width: 420px;
            width: min(420px, 92vw);
            padding: 12px;
            border-radius: 20px;
        }
        .logout-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .adamis-lang-picker {
            display: grid;
            gap: 10px;
            border: 1px solid rgba(92, 75, 37, .16);
            background: linear-gradient(180deg, rgba(255, 255, 255, .96), rgba(255, 250, 232, .92));
            box-shadow: 0 18px 42px rgba(92, 75, 37, .18), inset 0 1px 0 rgba(255, 255, 255, .8);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 18px;
            padding: 12px;
            color: #5C4B25;
        }
        .adamis-lang-picker__head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .adamis-lang-picker__label {
            font-size: 12px;
            font-weight: 900;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: #8B6B20;
        }
        .adamis-lang-picker__current {
            font-size: 12px;
            font-weight: 800;
            color: #5C4B25;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .adamis-lang-picker__current .adamis-lang-option__flag {
            width: 24px;
            height: 17px;
            border-radius: 4px;
        }
        .adamis-lang-picker__grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 7px;
        }
        .adamis-lang-picker button.adamis-lang-option {
            appearance: none;
            width: 100%;
            min-width: 0;
            min-height: 72px;
            padding: 8px 7px;
            display: grid;
            place-items: center;
            align-content: center;
            gap: 4px;
            border: 1px solid rgba(92, 75, 37, .16);
            border-radius: 14px;
            background: rgba(255, 255, 255, .72);
            color: #5C4B25;
            font: inherit;
            line-height: 1;
            text-align: center;
            cursor: pointer;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .75);
            transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease, background .16s ease;
        }
        .adamis-lang-option__flag {
            display: block;
            width: 34px;
            height: 24px;
            border: 1px solid rgba(92, 75, 37, .18);
            border-radius: 6px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 3px 8px rgba(92, 75, 37, .16), inset 0 0 0 1px rgba(255, 255, 255, .34);
            background: #fff;
        }
        .adamis-lang-option__flag--es { background: linear-gradient(to bottom, #c60b1e 0 25%, #ffc400 25% 75%, #c60b1e 75% 100%); }
        .adamis-lang-option__flag--en { background: linear-gradient(90deg, transparent 0 42%, #c8102e 42% 58%, transparent 58%), linear-gradient(0deg, transparent 0 40%, #c8102e 40% 60%, transparent 60%), linear-gradient(90deg, transparent 0 35%, #fff 35% 65%, transparent 65%), linear-gradient(0deg, transparent 0 31%, #fff 31% 69%, transparent 69%), linear-gradient(33deg, transparent 0 43%, #fff 43% 49%, #c8102e 49% 53%, #fff 53% 59%, transparent 59%), linear-gradient(-33deg, transparent 0 43%, #fff 43% 49%, #c8102e 49% 53%, #fff 53% 59%, transparent 59%), #012169; }
        .adamis-lang-option__flag--fr { background: linear-gradient(90deg, #0055a4 0 33.333%, #fff 33.333% 66.666%, #ef4135 66.666% 100%); }
        .adamis-lang-option__flag--de { background: linear-gradient(to bottom, #000 0 33.333%, #dd0000 33.333% 66.666%, #ffce00 66.666% 100%); }
        .adamis-lang-option__flag--it { background: linear-gradient(90deg, #009246 0 33.333%, #fff 33.333% 66.666%, #ce2b37 66.666% 100%); }
        .adamis-lang-option__flag--pt { background: linear-gradient(90deg, #006600 0 40%, #ff0000 40% 100%); }
        .adamis-lang-option__flag--pt::after { content: ""; position: absolute; width: 8px; height: 8px; border-radius: 50%; left: 36%; top: 50%; transform: translate(-50%, -50%); background: #ffcc00; box-shadow: 0 0 0 1px rgba(255, 255, 255, .55); }
        .adamis-lang-option__flag--ca { background: repeating-linear-gradient(to bottom, #fedd00 0 11.111%, #da121a 11.111% 22.222%); }
        .adamis-lang-option__flag--va { background: linear-gradient(90deg, #0057b8 0 30%, transparent 30%), repeating-linear-gradient(to bottom, #fedd00 0 11.111%, #da121a 11.111% 22.222%); }
        .adamis-lang-option__flag--gl { background: linear-gradient(145deg, transparent 0 41%, #6aaed6 41% 59%, transparent 59%), #fff; }
        .adamis-lang-option__flag--eu { background: linear-gradient(45deg, transparent 0 43%, #009b48 43% 57%, transparent 57%), linear-gradient(-45deg, transparent 0 43%, #009b48 43% 57%, transparent 57%), linear-gradient(90deg, transparent 0 42%, #fff 42% 58%, transparent 58%), linear-gradient(0deg, transparent 0 38%, #fff 38% 62%, transparent 62%), #d52b1e; }
        .adamis-lang-option__code {
            font-weight: 950;
            font-size: 13px;
            line-height: 1;
            letter-spacing: .08em;
        }
        .adamis-lang-picker button.adamis-lang-option:hover,
        .adamis-lang-picker button.adamis-lang-option:focus-visible {
            transform: translateY(-1px);
            background: rgba(255, 255, 255, .84);
            outline: none;
            box-shadow: 0 8px 18px rgba(92, 75, 37, .16), inset 0 1px 0 rgba(255, 255, 255, .8);
            border-color: rgba(179, 138, 44, .52);
        }
        .adamis-lang-picker button.adamis-lang-option.is-active {
            background: linear-gradient(180deg, #5C4B25, #8B6B20);
            color: #F9F1D0;
            border-color: rgba(92, 75, 37, .72);
            box-shadow: 0 10px 24px rgba(92, 75, 37, .24);
        }
        @media (max-width: 780px) {
            .access-grid {
                grid-template-columns: 1fr;
            }
            .container {
                padding: 24px;
            }
        }
        @media (max-width: 420px) {
            .logout-integrated {
                top: 12px;
                right: 12px;
                width: 48px !important;
                min-width: 48px !important;
                height: 48px !important;
                min-height: 48px !important;
            }
            .logout-modal {
                padding: 62px 12px 0 12px !important;
            }
            .settings-popover {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="shell">
        <div class="hero">
            <h1>ADAMIS</h1>
            <p>Selecciona el acceso adecuado para entrar en la plataforma.</p>
        </div>

        <div class="access-grid">
            <div class="container">
                <h2>Acceso Estudiantes</h2>
                <p class="helper">Entrada al aula para el alumnado.</p>

                <form action="/api/auth-login" method="POST" data-role="student">
                    <select name="centro" id="centro" data-school-select required>
                        <option value="" disabled selected>Selecciona tu centro</option>
                    </select>
                    <input type="password" name="password" placeholder="Contraseña de la clase" required>
                    <button type="submit">Entrar como alumno</button>
                </form>

                <p class="error" id="studentError">Contraseña incorrecta</p>
            </div>

            <div class="container">
                <h2>Acceso Profesorado</h2>
                <p class="helper">Vista de seguimiento y monitorización del alumnado.</p>

                <form action="/api/auth-profesor-login" method="POST" data-role="teacher">
                    <select name="centro" id="centro-profesor" data-school-select required>
                        <option value="" disabled selected>Selecciona tu centro</option>
                    </select>
                    <input type="password" name="password" placeholder="Contraseña de profesorado" required>
                    <button type="submit" class="teacher-button">Entrar como profesor</button>
                </form>

                <p class="error" id="teacherError">Contraseña de profesorado incorrecta</p>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');

        if (error === 'student' || error === 'true') {
            document.getElementById('studentError').style.display = 'block';
            if (navigator.vibrate) navigator.vibrate(200);
        }

        if (error === 'teacher') {
            document.getElementById('teacherError').style.display = 'block';
            if (navigator.vibrate) navigator.vibrate(200);
        }
    </script>
    <script>
        (function () {
            const forms = document.querySelectorAll("form");
            const schoolSelects = document.querySelectorAll("[data-school-select]");
            const SCHOOL_OPTIONS = [
                "Colegio Demo",
            ];

            function populateSchoolSelects() {
                schoolSelects.forEach((select) => {
                    const placeholder = select.querySelector('option[value=""]');
                    const form = select.closest("form");
                    const submitButton = form?.querySelector('button[type="submit"]');
                    const note = form?.querySelector("[data-school-note]");

                    SCHOOL_OPTIONS.forEach((schoolName) => {
                        const option = document.createElement("option");
                        option.value = schoolName;
                        option.textContent = schoolName;
                        select.appendChild(option);
                    });

                    const hasSchools = SCHOOL_OPTIONS.length > 0;

                    if (placeholder) {
                        placeholder.textContent = hasSchools
                            ? "Selecciona tu centro"
                            : "No hay centros configurados";
                    }

                    select.disabled = !hasSchools;
                    if (submitButton) submitButton.disabled = !hasSchools;
                    if (note) {
                        note.hidden = hasSchools;
                        note.textContent = "Agrega nombres en la constante SCHOOL_OPTIONS de splash.html para cargar este desplegable.";
                    }
                });
            }

            function uuid() {
                if (crypto?.randomUUID) return crypto.randomUUID();
                return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
                    const r = Math.random() * 16 | 0;
                    const v = c === 'x' ? r : (r & 0x3 | 0x8);
                    return v.toString(16);
                });
            }

            function getStudentUuid() {
                try {
                    let id = localStorage.getItem("adamis_student_uuid");
                    if (!id) {
                        id = uuid();
                        localStorage.setItem("adamis_student_uuid", id);
                    }
                    return id;
                } catch {
                    return uuid();
                }
            }

            function clearLegacyLocalStorage() {
                try {
                    for (let i = localStorage.length - 1; i >= 0; i--) {
                        const k = localStorage.key(i);
                        if (k && k.startsWith("poll:")) localStorage.removeItem(k);
                    }
                } catch {}
            }

            populateSchoolSelects();

            forms.forEach((form) => {
                form.addEventListener("submit", () => {
                    try {
                        sessionStorage.clear();
                        clearLegacyLocalStorage();

                        const centroField = form.querySelector('[name="centro"]');
                        sessionStorage.setItem("session_uuid", uuid());
                        sessionStorage.setItem("student_uuid", getStudentUuid());
                        sessionStorage.setItem("centro", centroField?.value || "");
                        sessionStorage.setItem("access_role", form.dataset.role || "student");
                    } catch {}
                });
            });
        })();
    </script>
</body>
</html>
