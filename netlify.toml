# 1. El Guardián (Protege la carpeta /app/)
[[edge_functions]]
  path = "/app/*"
  function = "guardian"

# 2. El Login (Procesa el formulario)
[[edge_functions]]
  path = "/auth-login"   # Esta es la URL "falsa" que procesará el login
  function = "login"



[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:;"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"