<!doctype html>
<html lang="es" data-page="splash">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADAMIS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Outfit:wght@200;700&display=swap" rel="stylesheet">

<style>
      body, html {
          margin: 0; padding: 0; height: 100%; overflow: hidden;
          font-family: 'Outfit', sans-serif;
          /* DEGRADADO SUAVE (Champagne Dorado) */
          background: linear-gradient(135deg, #F9F1D0 0%, #E6C874 50%, #F9F1D0 100%);
          /* IMPORTANTE: Indica que todo es clicable */
          cursor: pointer;
          -webkit-tap-highlight-color: transparent; /* Quita el flash azul en móviles */
      }

      /* Contenedor del Patrón de Monedas */
      .pattern-overlay {
          position: absolute;
          top: 0; left: 0; width: 100%; height: 200%;
          background-image: url('/app/assets/images/adamis_login.png');
          background-size: 90px 90px;
          background-repeat: repeat;
          opacity: 0.08; 
          transform: rotate(0deg); 
          animation: scrollPattern 40s linear infinite; 
          pointer-events: none; /* Deja pasar el clic al body */
      }

      @keyframes scrollPattern {
          0% { background-position: 0 0; }
          100% { background-position: 0 500px; } 
      }

      /* Contenido Central */
      .splash-content {
          position: relative;
          z-index: 10;
          height: 100%;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          text-align: center;
          pointer-events: none; /* Deja pasar el clic para evitar conflictos */
      }

      /* Título ADAMIS */
      .brand-title {
          font-size: 5rem;
          font-weight: 700;
          color: #5C4B25; /* Marrón oscuro bronce */
          letter-spacing: 0.1em;
          margin: 0;
          text-transform: uppercase;
          text-shadow: 0 2px 0 rgba(255,255,255,0.6);
          opacity: 0;
          transform: translateY(20px);
          animation: slideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 0.3s forwards;
      }

      /* Slogan */
      .brand-slogan {
          font-family: 'Inter', sans-serif;
          font-size: 1.2rem;
          color: #8B6B20; /* Dorado oscuro */
          margin-top: 15px;
          font-style: italic;
          opacity: 0;
          animation: slideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 0.6s forwards;
      }


      @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes fadeIn { to { opacity: 1; } }

      @media (max-width: 768px) {
          .brand-title { font-size: 3.5rem; }
      }
  </style>
  <script defer src="./i18n.js"></script>
  <script src="./page_transition.js?v=white-sheen-1"></script>
  <script defer src="./app.js"></script>
</head>
<body>
    <div class="pattern-overlay"></div>

    <main class="splash-content" id="splashMain">
        <h1 class="brand-title">ADAMIS</h1>
        <p class="brand-slogan">«Toca en cualquier parte para sumergirte en una aventura de Educación Financiera»</p>
    </main>

  <script>
    // Redirige al tocar/clicar/teclar en cualquier sitio
    (function () {
      // NOTA: Ajusta esta ruta si 'pages' está dentro de una carpeta 'app'
      const go = () => {
        if (window.AdamisPageTransition?.go) {
          window.AdamisPageTransition.go('/app/pages/menu.html');
        } else {
          window.location.href = '/app/pages/menu.html';
        }
      };
      
      // Usamos 'document' para asegurar que captura el clic en toda la pantalla
      document.addEventListener('click', go);
      document.addEventListener('touchstart', go, { passive: true });
      
      // Teclas habituales (Enter/Espacio)
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); }
      });
    })();
  </script>
</body>
</html>
