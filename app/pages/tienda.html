<!doctype html>
<html lang="es" data-page="tienda">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tienda</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <main>
    <section id="tienda" class="section section--tienda is-active" aria-label="Tienda">
      <div class="container tienda-wrap">
        <a class="btn back-integrated" href="./ranking.html" aria-label="Atras" title="Atras"></a>

        <header class="tienda-header">
          <div class="tienda-headline">
            <p class="tienda-kicker">Tienda</p>
            <h1 class="tienda-title">Canjea tus monedas</h1>
            <p class="tienda-subtitle">Elige articulos segun tu saldo disponible.</p>
          </div>

          <div class="tienda-actions">
            <div class="coins-display" aria-label="Monedas disponibles">
              <span class="coins-display__label">Monedas</span>
              <div class="coins-badge coins-badge--compact" data-coins-badge>
                <span class="coins-badge__num">0</span>
                <img src="../assets/icons/coin_ranking.png" alt="" class="coins-badge__icon" />
              </div>
            </div>

            <label class="tienda-sort">
              <span>Orden</span>
              <select id="tienda-sort" class="tienda-select" aria-label="Ordenar articulos">
                <option value="price-desc">Mayor a menor</option>
                <option value="price-asc">Menor a mayor</option>
              </select>
            </label>
          </div>
        </header>

        <div id="tienda-notice" class="tienda-notice" aria-live="polite"></div>
        <div id="tienda-grid" class="tienda-grid" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <script src="../data/user_state.js"></script>
  <script src="../coins.js"></script>
  <script src="../data/tienda.js"></script>
  <script src="../tienda.js"></script>
</body>
</html>
