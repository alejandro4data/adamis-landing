<!doctype html>
<html lang="es" data-page="actividades">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Palabra del día</title>
  <link rel="stylesheet" href="../style.css" />
  <script defer src="../i18n.js"></script>
</head>
<body>
  <main>
    <!-- Reutilizamos la estética de actividades -->
    <section id="palabra" class="section section--actividades is-active" aria-label="Palabra del día">
      <div class="container wdl-wrap" data-role="content">
        <a class="btn back-integrated" href="./actividades.html" aria-label="Atrás" title="Atrás"></a>

        <header class="wdl-header">
          <h1 class="wdl-title">Palabra del día</h1>
          <div class="reward-badge">
            <img src="../assets/icons/coin_ranking.png" alt="" />
            <span>1</span>
          </div>
        </header>

        <!-- Tablero (vacío; se genera por JS según la palabra/frase) -->
        <section class="wdl-board" role="grid" aria-label="Tablero de letras"></section>


        <!-- Teclado -->
        <nav class="wdl-kb" aria-label="Teclado en pantalla">
          <div class="wdl-kb-row">
            <button class="wdl-key" data-k="Q">Q</button><button class="wdl-key" data-k="W">W</button><button class="wdl-key" data-k="E">E</button>
            <button class="wdl-key" data-k="R">R</button><button class="wdl-key" data-k="T">T</button><button class="wdl-key" data-k="Y">Y</button>
            <button class="wdl-key" data-k="U">U</button><button class="wdl-key" data-k="I">I</button><button class="wdl-key" data-k="O">O</button><button class="wdl-key" data-k="P">P</button>
          </div>
          <div class="wdl-kb-row">
            <span class="wdl-kb-spacer"></span>
            <button class="wdl-key" data-k="A">A</button><button class="wdl-key" data-k="S">S</button><button class="wdl-key" data-k="D">D</button>
            <button class="wdl-key" data-k="F">F</button><button class="wdl-key" data-k="G">G</button><button class="wdl-key" data-k="H">H</button>
            <button class="wdl-key" data-k="J">J</button><button class="wdl-key" data-k="K">K</button><button class="wdl-key" data-k="L">L</button><button class="wdl-key" data-k="Ñ">Ñ</button>
            <span class="wdl-kb-spacer"></span>
          </div>
          <div class="wdl-kb-row">
            <button class="wdl-key wdl-key--wide wdl-key--confirm" data-k="ENTER" aria-label="Confirmar">Confirmar</button>
            <button class="wdl-key" data-k="Z">Z</button><button class="wdl-key" data-k="X">X</button><button class="wdl-key" data-k="C">C</button>
            <button class="wdl-key" data-k="V">V</button><button class="wdl-key" data-k="B">B</button><button class="wdl-key" data-k="N">N</button><button class="wdl-key" data-k="M">M</button>
            <button class="wdl-key wdl-key--wide" data-k="BACKSPACE">⌫</button>
          </div>
        </nav>

        <div class="wdl-toast" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <!-- Modal de resultado Palabra del día -->
    <div id="wdl-result" class="wdl-modal" hidden>
    <div class="wdl-modal__backdrop"></div>
    <div class="wdl-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="wdl-result-title">
        <header class="wdl-modal__header">
            <h2 class="wdl-modal__title" id="wdl-result-title">Resultado</h2>
        </header>
        <div class="wdl-modal__body">
            <div class="wdl-result">
                <div class="wdl-result-badge" id="wdl-result-badge">¡Correcto!</div>
                <h3 class="wdl-result-word" id="wdl-result-word">PALABRA</h3>
                <p class="wdl-result-def" id="wdl-result-def">Definición aquí.</p>
            </div>
        </div>

        <footer class="wdl-modal__footer">
        <button type="button" class="wdl-btn" id="wdl-result-ok">Entendido</button>
        </footer>
    </div>
    </div>


  <!-- Inyecta el botón de logout y su modal (ya lo tienes hecho en app.js) -->
  <script src="../app.js"></script>
  <!-- NUEVO: cargar palabras SIN fetch -->
  <script src="../data/palabras.js"></script>
  <!-- Lógica del juego -->
  <script src="../wordle.js"></script>
</body>
</html>
