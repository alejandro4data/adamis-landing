<!doctype html>
<html lang="es" data-page="actividades">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Frase del día</title>
  <link rel="stylesheet" href="../style.css" />
  <script defer src="../i18n.js"></script>
</head>
<body>
  <main>
    <section id="frase" class="section section--actividades is-active" aria-label="Frase del día">
      <div class="container snake-wrap">
        <a class="btn back-integrated" href="./actividades.html" aria-label="Atrás" title="Atrás"></a>

        <header class="snake-header">
          <h1 class="wdl-title">Frase del día</h1>
          <div class="reward-badge" title="Monedas conseguidas jugando">
            <img src="../assets/icons/coin_ranking.png" alt="" />
            <span id="coin-score">0</span>
          </div>
        </header>

        <section class="snake-card" aria-live="polite">
          <div id="phrase-pill" class="phrase-pill" aria-label="Progreso de la frase"></div>
          <!-- Tablero más pequeño: se calcula por JS, pero mantenemos el canvas -->
          <canvas id="snake-canvas" width="480" height="480" aria-label="Tablero del juego"></canvas>

          <div class="snake-cta">
            <button id="btn-restart" class="wdl-btn">Reiniciar</button>
          </div>
        </section>

        <p class="snake-help">
          Usa las flechas (o desliza en móvil) para moverte. Come las letras en orden para completar la frase.
        </p>
      </div>
    </section>
  </main>

  <!-- Modal de Game Over (estética compartida con Wordle) -->
  <div id="snake-result" class="wdl-modal" hidden>
    <div class="wdl-modal__backdrop"></div>
    <div class="wdl-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="snake-result-title">
      <header class="wdl-modal__header">
        <h2 class="wdl-modal__title" id="snake-result-title">Has perdido</h2>
      </header>
      <div class="wdl-modal__body">
        <div class="wdl-result">
          <div class="wdl-result-badge" id="snake-result-badge">Game Over</div>
          <p class="wdl-result-def" id="snake-result-text">
            Te chocaste con la pared o contigo mismo. ¿Quieres reiniciar?
          </p>
        </div>
      </div>
      <footer class="wdl-modal__footer">
        <button type="button" class="wdl-btn" id="snake-restart">Reiniciar</button>
        <a class="wdl-btn" href="./actividades.html">Salir</a>
      </footer>
    </div>
  </div>

  <!-- Cinemática de frase completada -->
  <div id="cinematic" class="cinematic is-hidden" aria-hidden="true">
    <div class="cinematic__backdrop"></div>
    <div class="cinematic__dialog" role="dialog" aria-modal="true" aria-labelledby="cin-title">
      <header class="cinematic__header">
        <h2 id="cin-title" class="cinematic__title">¡Frase completada!</h2>
      </header>
      <div class="cinematic__body">
        <p id="cin-phrase" class="cinematic__phrase"></p>
      </div>
      <footer class="cinematic__footer">
        <button id="cin-continue" class="wdl-btn">Continuar</button>
        <a class="wdl-btn" href="./actividades.html">Salir</a>
      </footer>
    </div>
  </div>


  <!-- Datos de frases (sin fetch) -->
  <script src="../data/frases.js"></script>
  <!-- Lógica del juego -->
  <script src="../actividades/snake-frase.js"></script>
</body>
</html>
