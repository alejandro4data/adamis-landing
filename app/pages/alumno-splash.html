<!doctype html>
<html lang="es" data-page="student-splash">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ADAMIS - Aventura financiera</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <link rel="preload" as="image" href="../../assets/logo.png" />
  <link rel="preload" as="image" href="../assets/images/adamis_peeking_gold.png" />
  <script src="../page_transition.js?v=white-sheen-1"></script>
</head>
<body>
  <main>
    <section id="studentSplash" class="section section--student-splash is-active" aria-label="Inicio de aventura">
      <button class="student-splash-hitarea" type="button" aria-label="Entrar al menu">
        <span class="student-splash-stars" aria-hidden="true">
          <i class="spark spark--1"></i>
          <i class="spark spark--2"></i>
          <i class="spark spark--3"></i>
          <i class="spark spark--4"></i>
          <i class="spark spark--5"></i>
          <i class="spark spark--6"></i>
          <i class="spark spark--7"></i>
          <i class="spark spark--8"></i>
          <i class="spark spark--9"></i>
          <i class="spark spark--10"></i>
          <i class="spark spark--11"></i>
          <i class="spark spark--12"></i>
          <i class="spark spark--13"></i>
          <i class="spark spark--14"></i>
        </span>

        <span class="student-splash-layout">
          <span class="student-splash-copy">
            <span class="student-splash-brand" aria-label="ADAMIS">
              <img src="../../assets/logo.png" alt="" class="student-splash-logo" />
              <span class="student-splash-wordmark">ADAMIS</span>
            </span>
            <span class="student-splash-line">Toca en cualquier parte para sumergirte en una aventura de Educaci&oacute;n Financiera.</span>
          </span>

          <span class="student-splash-visual" aria-hidden="true">
            <span class="student-splash-orbit student-splash-orbit--outer"></span>
            <span class="student-splash-orbit student-splash-orbit--inner"></span>
            <img src="../assets/images/adamis_peeking_gold.png" alt="" />
          </span>
        </span>
      </button>
    </section>
  </main>

  <script>
    (function () {
      var isNavigating = false;
      var go = function () {
        if (isNavigating) return;
        isNavigating = true;
        if (window.AdamisPageTransition && typeof window.AdamisPageTransition.go === 'function') {
          window.AdamisPageTransition.go('./menu.html');
        } else {
          window.location.href = './menu.html';
        }
      };

      var root = document.getElementById('studentSplash');
      if (root) root.addEventListener('click', go);
      document.addEventListener('keydown', function (event) {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          go();
        }
      });
    })();
  </script>
</body>
</html>
