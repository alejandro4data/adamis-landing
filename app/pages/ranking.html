<!doctype html>
<html lang="es" data-page="ranking">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ranking</title>
  <link rel="stylesheet" href="../style.css" />
  <script defer src="../i18n.js"></script>
  <script src="../page_transition.js?v=white-sheen-1"></script>
</head>
<body>
  <main>
    <section id="ranking" class="section section--ranking is-active" aria-label="Ranking">
      <div class="container ranking-grid" data-role="content">
        <a class="btn back-integrated" href="./menu.html" aria-label="Atrás" title="Atrás"></a>

        <div class="ranking-topbar" aria-label="Accesos de tienda">
          <div class="coins-display" aria-label="Monedas disponibles">
            <span class="coins-display__label">Monedas</span>
            <div class="coins-badge coins-badge--compact" data-coins-badge>
              <span class="coins-badge__num">0</span>
              <img src="../assets/icons/coin_ranking.webp" alt="" class="coins-badge__icon" />
            </div>
          </div>
          <a class="shop-integrated" href="./tienda.html" aria-label="Ir a la tienda">
            <span>Tienda</span>
          </a>
        </div>

        <section class="ranking-left" aria-label="Clasificación Top 5">
          <header class="ranking-header" aria-hidden="true"></header>

          <ol class="ranking-list">
            <li class="ranking-item">
              <div class="place-badge">1</div>
              <div class="name">Lucía Fernández</div>
              <div class="score">
                <img src="../assets/icons/coin_ranking.webp" alt="" class="coin" />
                <img src="../assets/icons/coin_ranking.webp" alt="" class="coin" />
                <img src="../assets/icons/coin_ranking.webp" alt="" class="coin" />
                <img src="../assets/icons/coin_ranking.webp" alt="" class="coin" />
                <img src="../assets/icons/coin_ranking.webp" alt="" class="coin" />
              </div>
            </li>

            <li class="ranking-item">
              <div class="place-badge">2</div>
              <div class="name">Sofía Martín</div>
              <div class="score">
                <img src="../assets/icons/coin_ranking.webp" alt="" class="coin" />
                <img src="../assets/icons/coin_ranking.webp" alt="" class="coin" />
                <img src="../assets/icons/coin_ranking.webp" alt="" class="coin" />
                <img src="../assets/icons/coin_ranking.webp" alt="" class="coin" />
              </div>
            </li>

            <li class="ranking-item">
              <div class="place-badge">3</div>
              <div class="name">Diego López</div>
              <div class="score">
                <img src="../assets/icons/coin_ranking.webp" alt="" class="coin" />
                <img src="../assets/icons/coin_ranking.webp" alt="" class="coin" />
                <img src="../assets/icons/coin_ranking.webp" alt="" class="coin" />
                <img src="../assets/icons/coin_ranking.webp" alt="" class="coin" />

            <li class="ranking-item">

                <img src="../assets/icons/coin_ranking.webp" alt="" class="coin" />
              </div>
            </li>

            <li class="ranking-item">
              <div class="place-badge">5</div>
              <div class="name">Carlos García</div>
              <div class="score">
                <img src="../assets/icons/coin_ranking.webp" alt="" class="coin" />
                <img src="../assets/icons/coin_ranking.webp" alt="" class="coin" />
                <img src="../assets/icons/coin_ranking.webp" alt="" class="coin" />
              </div>
            </li>
          </ol>
        </section>

        <aside class="ranking-right" aria-label="Ilustración">
          <img src="../assets/images/adamis_ranking.webp" alt="" class="ranking-hero" />
        </aside>
      </div>
    </section>
  </main>

  <script defer src="../data/user_state.js"></script>
  <script defer src="../coins.js"></script>
  <script defer src="../ranking.js"></script>
</body>
</html>
