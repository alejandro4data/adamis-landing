<!doctype html>
<html lang="es" data-page="actividades">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Actividades</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <main>
    <section id="actividades" class="section section--actividades is-active" aria-label="Actividades">
      <div class="container activities-wrap" data-role="content">
        <a class="btn back-integrated" href="./menu.html" aria-label="Atrás" title="Atrás"></a>

        <!-- 3 DIARIAS (1 moneda) -->
        <section class="activities-group group--daily" aria-label="Actividades diarias (1 moneda)">
          <header class="group-header">
            <h2>Diarias</h2>
            <div class="reward-badge">
              <img src="../assets/icons/coin_ranking.png" alt="" />
              <span>1</span>
            </div>
          </header>

          <div class="activities-grid">
            <a class="activity-card" href="./crucigrama.html" aria-label="Crucigrama del día">
              <h3 class="activity-title">Crucigrama del día</h3>
              <div class="activity-meta">
                <img src="../assets/icons/coin_ranking.png" alt="" class="coin"/><span>1</span>
              </div>
            </a>

            <a class="activity-card" href="./palabra.html" aria-label="Palabra del día">
              <h3 class="activity-title">Palabra del día</h3>
              <div class="activity-meta">
                <img src="../assets/icons/coin_ranking.png" alt="" class="coin"/><span>1</span>
              </div>
            </a>

            <a class="activity-card" href="./frase.html" aria-label="Frase del día">
              <h3 class="activity-title">Frassse del día</h3>
              <div class="activity-meta">
                <img src="../assets/icons/coin_ranking.png" alt="" class="coin"/><span>1</span>
              </div>
            </a>
          </div>
        </section>

        <!-- 2 SEMANALES (5 monedas) -->
        <section class="activities-group group--weekly" aria-label="Actividades semanales (5 monedas)">
          <header class="group-header">
            <h2>Semanales</h2>
            <div class="reward-badge">
              <img src="../assets/icons/coin_ranking.png" alt="" />
              <span>5</span>
            </div>
          </header>

          <div class="activities-grid">
            <a class="activity-card activity-card--wide" href="./oferta_demanda.html" aria-label="Oferta y demanda">
              <h3 class="activity-title">Oferta y Demanda</h3>
              <div class="activity-meta">
                <img src="../assets/icons/coin_ranking.png" alt="" class="coin"/><span>5</span>
              </div>
            </a>

            <a class="activity-card activity-card--wide" href="./ticket.html" aria-label="Error en el ticket">
              <h3 class="activity-title">Error en el ticket</h3>
              <div class="activity-meta">
                <img src="../assets/icons/coin_ranking.png" alt="" class="coin"/><span>5</span>
              </div>
            </a>
          </div>
        </section>

        <!-- 1 MENSUAL (10 monedas) -->
        <section class="activities-group group--monthly" aria-label="Actividad mensual (10 monedas)">
          <header class="group-header">
            <h2>Mensual</h2>
            <div class="reward-badge">
              <img src="../assets/icons/coin_ranking.png" alt="" />
              <span>10</span>
            </div>
          </header>

          <div class="activities-grid">
            <article class="activity-card activity-card--full">
              <h3 class="activity-title">Proyecto de ahorro del mes</h3>
              <div class="activity-meta">
                <img src="../assets/icons/coin_ranking.png" alt="" class="coin"/><span>10</span>
              </div>
            </article>
          </div>
        </section>
      </div>
    </section>
  </main>
</body>
</html>
