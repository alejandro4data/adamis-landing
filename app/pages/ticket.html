<!doctype html>
<html lang="es" data-page="actividades">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Error en el ticket</title>
  <link rel="stylesheet" href="../style.css" />
  <script defer src="../i18n.js"></script>
  <script src="../page_transition.js?v=white-sheen-1"></script>
</head>
<body>
  <main>
    <section id="ticket" class="section section--actividades is-active" aria-label="Error en el ticket">
      <div class="container ticket-wrap">
        <a class="btn back-integrated" href="./actividades.html" aria-label="Atras" title="Atras"></a>

        <header class="ticket-header">
          <h1 class="ticket-title">Error en el ticket</h1>
          <div class="reward-badge">
            <img src="../assets/icons/coin_ranking.webp" alt="" />
            <span>5</span>
          </div>
        </header>

        <div class="ticket-layout">
          <section class="ticket-panel ticket-panel--purchase" aria-label="Tu compra">
            <h2 class="ticket-panel-title">Tu compra</h2>
            <div id="ticket-purchase-grid" class="ticket-purchase-grid"></div>
          </section>

          <section class="ticket-panel ticket-panel--receipt" aria-label="Ticket">
            <div class="receipt-table">
              <div class="receipt-row receipt-row--head">
                <div>Objeto</div>
                <div>Valor</div>
                <div>Unidades</div>
                <div>Total</div>
              </div>
              <div id="ticket-receipt-body"></div>
            </div>
            <div class="receipt-total">
              <span>Total:</span>
              <button type="button" id="ticket-total-value" class="ticket-field" data-key="ticket-total" aria-label="Total del ticket"></button>
            </div>
          </section>
        </div>

        <div class="ticket-actions">
          <button type="button" id="ticket-no-errors" class="ticket-btn">No hay ningun error</button>

          <div class="ticket-pay">
            <div class="ticket-pay-row">
              <span>Pagaste:</span>
              <div id="ticket-paid-value" class="ticket-pay-value"></div>
            </div>
            <div class="ticket-pay-row">
              <span>Te devolvieron:</span>
              <button type="button" id="ticket-change-value" class="ticket-field ticket-pay-value" data-key="change" aria-label="Te devolvieron"></button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="ticket-toast" class="ticket-toast" aria-live="polite"></div>

  <div id="ticket-result" class="ticket-modal" hidden>
    <div class="ticket-modal__backdrop"></div>
    <div class="ticket-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="ticket-result-title">
      <h2 id="ticket-result-title" class="ticket-result-title">Resultado</h2>
      <div id="ticket-stars" class="ticket-stars">
        <span class="ticket-star" style="--i:0">&#9733;</span>
        <span class="ticket-star" style="--i:1">&#9733;</span>
        <span class="ticket-star" style="--i:2">&#9733;</span>
      </div>
      <p id="ticket-result-text" class="ticket-result-text"></p>
      <div class="ticket-result-actions">
        <button type="button" id="ticket-result-ok" class="ticket-btn">Otro ticket</button>
        <a class="ticket-btn ticket-btn--ghost" href="./menu.html">Salir al menu</a>
      </div>
    </div>
  </div>

  <script defer src="../data/user_state.js"></script>
  <script defer src="../events.js"></script>
  <script defer src="../rewards.js"></script>
  <script defer src="../assets/assets_ticket/manifest.js"></script>
  <script defer src="../actividades/ticket.js"></script>
</body>
</html>
