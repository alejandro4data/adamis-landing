<!doctype html>
<html lang="es" data-page="login">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Acceso</title>
  <meta name="description" content="Pantalla de inicio de sesión del prototipo." />

  <!-- Hoja de estilos global (los estilos específicos del login van al final de style.css) -->
  <link rel="stylesheet" href="../style.css" />
<!-- Preload de la imagen de Adamis para el fondo -->
  <link rel="preload" as="image" href="../assets/images/adamis_login.webp" />

  <script defer src="../i18n.js"></script>
  <script src="../page_transition.js?v=white-sheen-1"></script>
  <script defer src="../app.js"></script>
</head>
<body>
  <main>
    <section id="login" class="section section--login is-active" aria-label="Acceso">
      <div class="login-card" role="region" aria-label="Formulario de acceso">
        <h1 class="login-title">¡Bienvenido/a de Nuevo!</h1>

        <form id="loginForm" class="login-form" novalidate autocomplete="off">
          <div class="field">
            <label for="user">Usuario</label>
            <input
              id="user"
              name="user"
              class="login-input"
              type="text"
              inputmode="text"
              placeholder="Escribe tu usuario"
              autofocus
            />
          </div>

          <div class="field">
            <label for="pass">Contraseña</label>
            <input
              id="pass"
              name="pass"
              class="login-input"
              type="password"
              placeholder="••••••••"
            />
          </div>

          <div class="actions">
            <button id="loginBtn" type="submit" class="btn--coin">Iniciar Sesión</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <script>
    // Acepta cualquier combinación y redirige al menú.
    (function () {
      const form = document.getElementById('loginForm');
      const user = document.getElementById('user');
      form.addEventListener('submit', (ev) => {
        ev.preventDefault();
        try { localStorage.setItem('currentUser', user.value || ''); } catch(e) {}
        if (window.AdamisPageTransition?.go) {
          window.AdamisPageTransition.go('./menu.html');
        } else {
          window.location.href = './menu.html';
        }
      }, false);
    })();
  </script>
</body>
</html>
